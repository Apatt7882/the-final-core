<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>HUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="hud" class="hidden">
        <!-- Top right: time, money, job -->
        <section class="status" aria-label="Status">
            <div class="clock">
                <span class="time" id="time">--:--</span>
                <span class="date" id="date"></span>
            </div>

            <div class="row" data-account="cash">
                <span class="delta" id="cash-delta"></span>
                <span class="value" id="cash">$0</span>
                <span class="icon" aria-label="Cash">
                    <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/></svg>
                </span>
            </div>

            <div class="row" data-account="bank">
                <span class="delta" id="bank-delta"></span>
                <span class="value" id="bank">$0</span>
                <span class="icon" aria-label="Bank">
                    <svg viewBox="0 0 24 24"><path d="M3 9.5 12 4l9 5.5"/><path d="M5 10v7M9.5 10v7M14.5 10v7M19 10v7"/><path d="M3 20h18"/></svg>
                </span>
            </div>

            <div class="row credit hidden" data-account="credit">
                <span class="delta" id="credit-delta"></span>
                <span class="value" id="credit">$0</span>
                <span class="icon" aria-label="Credit">
                    <svg viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 9.5h19M6 15h4"/></svg>
                </span>
            </div>

            <div class="row job">
                <span class="duty" id="duty" title="Duty"></span>
                <span class="value"><span id="job-label">Unemployed</span><span class="grade" id="job-grade"></span></span>
                <span class="icon" aria-label="Job">
                    <svg viewBox="0 0 24 24"><rect x="3" y="7.5" width="18" height="12" rx="2"/><path d="M9 7.5V5.5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5.5v2M3 12.5h18"/></svg>
                </span>
            </div>
        </section>

        <!-- Bottom left, beside the minimap: AOP and priority, who's on, then location -->
        <div class="corner" id="corner">
            <section class="aop hidden" id="aop" aria-label="AOP and priority"></section>
            <section class="counts hidden" id="counts" aria-label="Who's on"></section>

            <section class="location" id="location" aria-label="Location">
                <span class="compass" id="dir">N</span>
                <span class="postal hidden" id="postal-box">
                    <span class="postal-label">Postal</span>
                    <span class="postal-code" id="postal">000</span>
                </span>
                <span class="place">
                    <span class="street" id="street"></span>
                    <span class="zone" id="zone"></span>
                </span>
            </section>
        </div>
    </div>

    <!-- Notifications from every TFC resource (top centre, shown even with the HUD hidden) -->
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="app.js"></script>
</body>
</html>
